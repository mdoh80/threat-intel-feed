name: Validate dashboard

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/threat-intel-dashboard
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |path| YAML.load_file(path); puts "valid #{path}" }'
      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v
